// SVG RADAR CHART
// ─────────────────────────────────────────────────────────────────
function RadarChart({ data, size = 260 }) {
  const cx = size / 2, cy = size / 2, r = size * 0.36;
  const n = data.length;
  const angles = data.map((_, i) => (i / n) * 2 * Math.PI - Math.PI / 2);
  const pt = (val, ai) => ({
    x: cx + r * (val / 100) * Math.cos(angles[ai]),
    y: cy + r * (val / 100) * Math.sin(angles[ai]),
  });
  const gridPts = (frac) => angles.map(a => ({ x: cx + r * frac * Math.cos(a), y: cy + r * frac * Math.sin(a) }));
  const poly = (pts) => pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[0.25, 0.5, 0.75, 1].map(f => (
        <polygon key={f} points={poly(gridPts(f))} fill="none" stroke={C.gray} strokeWidth="1" />
      ))}
      {angles.map((a, i) => (
        <line key={i} x1={cx} y1={cy} x2={cx + r * Math.cos(a)} y2={cy + r * Math.sin(a)} stroke={C.gray} strokeWidth="1" />
      ))}
      <polygon points={poly(data.map((d, i) => pt(d.projected, i)))} fill="rgba(190,0,0,0.12)" stroke={C.red} strokeWidth="2" strokeLinejoin="round" />
      <polygon points={poly(data.map((d, i) => pt(d.actual, i)))} fill="rgba(0,133,124,0.18)" stroke={C.teal} strokeWidth="2" strokeLinejoin="round" />
      {data.map((d, i) => {
        const lx = cx + (r + 20) * Math.cos(angles[i]);
        const ly = cy + (r + 20) * Math.sin(angles[i]);
        return (
          <text key={i} x={lx.toFixed(1)} y={ly.toFixed(1)} textAnchor="middle" dominantBaseline="middle"
            fontSize="10" fill="#555" fontFamily="Inter,sans-serif">
            {d.name.split(' ')[0]}
          </text>
        );
      })}
    </svg>
  );
}

function ValueScoring() {
  const [cats, setCats] = useState(SCORING_DEFAULT.map(s => ({ ...s })));
  const [editingWeights, setEditingWeights] = useState(false);
  const [tempW, setTempW] = useState(Object.fromEntries(SCORING_DEFAULT.map(s => [s.id, s.weight])));

  const totalW = cats.reduce((s, c) => s + c.weight, 0);
  const projected = Math.round(cats.reduce((s, c) => s + c.projected * (c.weight / totalW), 0));
  const actual    = Math.round(cats.reduce((s, c) => s + c.actual    * (c.weight / totalW), 0));
  const gap       = projected - actual;

  const saveWeights = () => {
    const sum = Object.values(tempW).reduce((s, v) => s + v, 0);
    if (sum !== 100) { alert(`Weights must sum to 100. Current total: ${sum}`); return; }
    setCats(cats.map(c => ({ ...c, weight: tempW[c.id] })));
    setEditingWeights(false);
  };

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <SectionHeader title="Value Scoring" subtitle="Weighted composite score across 5 value dimensions — projected vs actual realization" />
        <button onClick={() => editingWeights ? saveWeights() : setEditingWeights(true)}
          className="px-4 py-2 rounded-md text-sm font-medium transition-colors"
          style={editingWeights ? { background: C.red, color: 'white' } : { background: 'white', color: C.charcoal, border: `1px solid ${C.gray}` }}>
          {editingWeights ? 'Save Weights' : 'Edit Weights'}
        </button>
      </div>

      {/* Score tiles */}
      <div className="grid grid-cols-3 gap-4">
        <Card className="p-5 text-center">
          <div className="text-xs text-gray-400 uppercase tracking-wide mb-1">Projected Value Score</div>
          <div className="text-4xl font-bold" style={{ color: C.red }}>{projected}</div>
          <div className="text-xs text-gray-400 mt-1">/ 100</div>
        </Card>
        <Card className="p-5 text-center">
          <div className="text-xs text-gray-400 uppercase tracking-wide mb-1">Actual Value Score</div>
          <div className="text-4xl font-bold" style={{ color: C.charcoal }}>{actual}</div>
          <div className="text-xs text-gray-400 mt-1">/ 100</div>
        </Card>
        <Card className="p-5 text-center">
          <div className="text-xs text-gray-400 uppercase tracking-wide mb-1">Realization Gap</div>
          <div className="text-4xl font-bold text-amber-500">{gap}</div>
          <div className="text-xs text-gray-400 mt-1">points to close</div>
        </Card>
      </div>

      <div className="grid grid-cols-2 gap-5">
        {/* Radar */}
        <Card className="p-5 flex flex-col items-center">
          <h3 className="font-semibold text-gray-800 mb-3 self-start">Projected vs Actual Radar</h3>
          <RadarChart data={cats} size={260} />
          <div className="flex gap-6 mt-3">
            <div className="flex items-center gap-2 text-xs text-gray-600">
              <span style={{ display: 'inline-block', width: 16, height: 2, background: C.red }} /> Projected
            </div>
            <div className="flex items-center gap-2 text-xs text-gray-600">
              <span style={{ display: 'inline-block', width: 16, height: 2, background: C.teal }} /> Actual
            </div>
          </div>
        </Card>

        {/* Category breakdown */}
        <Card className="overflow-hidden">
          <div className="px-5 py-4 border-b border-gray-100">
            <h3 className="font-semibold text-gray-800">Category Breakdown</h3>
          </div>
          <div className="divide-y divide-gray-100">
            {cats.map(cat => (
              <div key={cat.id} className="px-5 py-4">
                <div className="flex items-start justify-between mb-2">
                  <div className="flex-1 pr-4">
                    <div className="flex items-center gap-2 mb-0.5 flex-wrap">
                      <span className="font-medium text-sm text-gray-800">{cat.name}</span>
                      {editingWeights ? (
                        <div className="flex items-center gap-1">
                          <input type="number" value={tempW[cat.id]} min={0} max={100}
                            onChange={e => setTempW(p => ({ ...p, [cat.id]: Number(e.target.value) }))}
                            className="w-14 border border-gray-200 rounded px-1.5 py-0.5 text-xs text-right focus:outline-none" />
                          <span className="text-xs text-gray-400">%</span>
                        </div>
                      ) : (
                        <span className="text-xs text-gray-400">{cat.weight}% weight</span>
                      )}
                    </div>
                    <p className="text-xs text-gray-500">{cat.description}</p>
                  </div>
                  <div className="text-right text-sm font-bold flex-shrink-0">
                    <span style={{ color: C.red }}>{cat.projected}</span>
                    <span className="text-gray-300 mx-1">/</span>
                    <span style={{ color: C.teal }}>{cat.actual}</span>
                  </div>
                </div>
                <div className="space-y-1.5 mb-2">
                  <div className="flex items-center gap-2">
                    <span className="text-xs text-gray-400 w-14 flex-shrink-0">Projected</span>
                    <div className="flex-1"><Bar value={cat.projected} color={C.red} /></div>
                    <span className="text-xs font-medium w-6 text-right" style={{ color: C.red }}>{cat.projected}</span>

                    <span className="text-xs text-gray-400 w-14 flex-shrink-0">Actual</span>

                    <span className="text-xs font-medium w-6 text-right" style={{ color: C.teal }}>{cat.actual}</span>

                  {cat.drivers.map(d => (
                    <span key={d} className="px-2 py-0.5 rounded text-xs text-gray-500" style={{ background: C.offwhite, border: `1px solid ${C.gray}` }}>{d}</span>

          {editingWeights && (
            <div className="px-5 py-3 bg-amber-50 border-t border-amber-200 text-xs text-amber-700">
              Weights must sum to 100. Current total: <strong>{Object.values(tempW).reduce((s, v) => s + v, 0)}</strong>
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

function KPIFramework({ kpis, onKpisChange }) {
  const [filter, setFilter] = useState('all');
  const OPTIONS = [
    { v: 'all', l: 'All KPIs' }, { v: 'tracking-live', l: 'Tracking Live' },
    { v: 'tbd', l: 'TBD' }, { v: 'baseline-confirmed', l: 'Baseline Confirmed' }, { v: 'at-risk', l: 'At Risk' },
  ];
  const filtered = filter === 'all' ? kpis : kpis.filter(k => k.status === filter);

  return (
    <div className="space-y-4">
      <div className="flex items-start justify-between flex-wrap gap-3">
        <SectionHeader title="KPI Framework" subtitle="6 ICF-specific KPIs across time savings, quality, adoption, and user experience" />
        <div className="flex gap-1 flex-wrap">
          {OPTIONS.map(o => (
            <button key={o.v} onClick={() => setFilter(o.v)}
              className="px-3 py-1 rounded-full text-xs font-medium transition-colors"
              style={filter === o.v ? { background: C.red, color: 'white' } : { background: 'white', color: '#6b7280', border: `1px solid ${C.gray}` }}>
              {o.l}
            </button>
          ))}
        </div>
      </div>

      <div className="flex gap-4 text-sm pb-1">
        {Object.entries(KPI_STATUS).map(([s, cfg]) => {
          const count = kpis.filter(k => k.status === s).length;
          if (!count) return null;
          return (
            <span key={s} className="text-gray-500">
              <span className="font-semibold text-gray-800">{count}</span> {cfg.label}
            </span>
          );
        })}
      </div>

      <div className="space-y-4">
        {filtered.map(k => (
          <KPICard key={k.id} kpi={k} onUpdate={updated => onKpisChange(kpis.map(k2 => k2.id === updated.id ? updated : k2))} />
        ))}
      </div>

      {filtered.length === 0 && (
        <Card className="p-8 text-center text-gray-400 text-sm">No KPIs match the selected filter.</Card>
      )}
    </div>
  );
}

function ValueCalculator({ calc, setCalc }) {
  const set = (k, v) => setCalc(p => ({ ...p, [k]: v }));

  const cPerDoc  = calc.countryBaseline * (calc.countryReduction / 100);
  const cAnnual  = cPerDoc * calc.countryVolume;
  const sPerDoc  = calc.siteBaseline   * (calc.siteReduction    / 100);
  const sAnnual  = sPerDoc * calc.siteVolume;
  const total    = cAnnual + sAnnual;
  const qeAvoid  = calc.qeBaseline * (calc.qeReduction / 100);
  const qeDol    = qeAvoid * calc.costPerQE;
  const hardVal  = total * calc.hourlyRate + qeDol;
  const e2eDays  = calc.e2eBaseline * (calc.e2eReduction / 100);
  const annDays  = e2eDays * calc.studyVolume;

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-3">
        <SectionHeader title="Value Calculator" subtitle="Edit assumptions — all outputs update immediately" />
        <button onClick={() => setCalc(CALC_DEFAULT)}
          className="px-4 py-2 rounded-md text-sm font-medium transition-colors"
          style={{ background: 'white', color: C.charcoal, border: `1px solid ${C.gray}` }}>
          ↺ Reset to Defaults
        </button>
      </div>

      <div className="grid grid-cols-2 gap-5">
        {/* Country ICF */}
        <Card className="p-5">
          <h3 className="font-semibold text-gray-800 mb-1">Country ICF Adaptation <span className="text-xs font-normal text-gray-400">(KPI 1)</span></h3>
          <p className="text-xs text-gray-400 mb-3">Inputs</p>
          <InputRow label="Baseline hours per document"  value={calc.countryBaseline}   onChange={v => set('countryBaseline',  v)} unit="hrs/doc" />
          <InputRow label="Target reduction"             value={calc.countryReduction}  onChange={v => set('countryReduction', v)} unit="%" />
          <InputRow label="Annual document volume"       value={calc.countryVolume}     onChange={v => set('countryVolume',    v)} unit="docs/yr" />
          <p className="text-xs text-gray-400 mt-4 mb-2">Outputs</p>
          <ResultRow label="Hours saved per document"  value={`${fmt(cPerDoc, 1)} hrs`}   formula={`${calc.countryBaseline} hrs × ${calc.countryReduction}% = ${fmt(cPerDoc, 1)} hrs/doc`} />
          <ResultRow label="Annual hours saved"        value={`${fmt(cAnnual)} hrs/yr`}   formula={`${fmt(cPerDoc, 1)} hrs × ${calc.countryVolume} docs = ${fmt(cAnnual)} hrs`} />
        </Card>

        {/* Site ICF */}
        <Card className="p-5">
          <h3 className="font-semibold text-gray-800 mb-1">Site ICF Adaptation <span className="text-xs font-normal text-gray-400">(KPI 2 — Q2 2026)</span></h3>
          <p className="text-xs text-gray-400 mb-3">Inputs</p>
          <InputRow label="Baseline hours per document"  value={calc.siteBaseline}    onChange={v => set('siteBaseline',   v)} unit="hrs/doc" />
          <InputRow label="Target reduction"             value={calc.siteReduction}   onChange={v => set('siteReduction',  v)} unit="%" />
          <InputRow label="Annual document volume"       value={calc.siteVolume}      onChange={v => set('siteVolume',     v)} unit="docs/yr" />
          <p className="text-xs text-gray-400 mt-4 mb-2">Outputs</p>
          <ResultRow label="Hours saved per document"  value={`${fmt(sPerDoc, 1)} hrs`}   formula={`${calc.siteBaseline} hrs × ${calc.siteReduction}% = ${fmt(sPerDoc, 1)} hrs/doc`} />
          <ResultRow label="Annual hours saved"        value={`${fmt(sAnnual)} hrs/yr`}   formula={`${fmt(sPerDoc, 1)} hrs × ${calc.siteVolume} docs = ${fmt(sAnnual)} hrs`} />
        </Card>

        {/* QE Reduction */}
        <Card className="p-5">
          <h3 className="font-semibold text-gray-800 mb-1">Quality Event Reduction <span className="text-xs font-normal text-gray-400">(KPI 4 — Q3 2026)</span></h3>
          <p className="text-xs text-gray-400 mb-3">Inputs — adaptation QEs only, version-correction excluded</p>
          <InputRow label="Baseline QEs per year"       value={calc.qeBaseline}   onChange={v => set('qeBaseline',   v)} unit="QEs/yr" />

// SECTION 7 — MEASUREMENT READINESS
// ─────────────────────────────────────────────────────────────────
function MeasurementReadiness() {
  const totalContrib = READINESS.reduce((s, i) => {
    if (i.status === 'ready')   return s + i.contrib;
    if (i.status === 'partial') return s + i.contrib * 0.5;
    return s;
  }, 0);
  const maxContrib = READINESS.reduce((s, i) => s + i.contrib, 0);
  const score = Math.round((totalContrib / maxContrib) * 100);

  const counts = Object.fromEntries(['ready', 'partial', 'not-ready', 'future'].map(s => [s, READINESS.filter(i => i.status === s).length]));

  return (
    <div className="space-y-5">
      <div className="flex items-center justify-between flex-wrap gap-4">
        <SectionHeader title="Measurement Readiness" subtitle="ICF data infrastructure, timestamp coverage, and baseline data readiness for full KPI measurement" />
        <Card className="px-5 py-3 flex items-center gap-4 flex-shrink-0">
          <div>
            <div className="text-xs text-gray-400 uppercase tracking-wide">Overall Readiness</div>
            <div className="text-2xl font-bold" style={{ color: C.red }}>{score}%</div>
          </div>
          <div style={{ width: 80, height: 8, background: C.gray, borderRadius: 999, overflow: 'hidden' }}>
            <div style={{ width: `${score}%`, height: '100%', background: C.red, borderRadius: 999 }} />
          </div>
        </Card>
      </div>

      {/* Status summary tiles */}
      <div className="grid grid-cols-4 gap-3">
        {[
          { s: 'ready',     cls: 'border-teal-200' },
          { s: 'partial',   cls: 'border-amber-200' },
          { s: 'not-ready', cls: 'border-red-200' },
          { s: 'future',    cls: 'border-purple-200' },
        ].map(({ s, cls }) => {
          const rc = READINESS_STATUS[s];
          return (
            <Card key={s} className={`p-4 border ${cls}`}>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-base">{rc.icon}</span>
                <span className="text-xs font-semibold text-gray-500">{rc.label}</span>
              </div>
              <div className="text-2xl font-bold text-gray-800">{counts[s]}</div>
            </Card>
          );
        })}
      </div>

      {/* Readiness table */}
      <Card className="overflow-hidden">
        <table className="w-full text-sm">
          <thead>
            <tr className="bg-gray-50 border-b border-gray-200">
              {['Readiness Item', 'Status', 'Owner', 'Category', 'Dependency', 'Contrib'].map(h => (
                <th key={h} className="text-left px-4 py-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {READINESS.map((item, i) => {
              const rc = READINESS_STATUS[item.status];
              return (
                <tr key={item.id} className={`border-b border-gray-100 ${i % 2 === 0 ? 'bg-white' : 'bg-gray-50/40'}`}>
                  <td className="px-4 py-3">
                    <div className="font-medium text-gray-800 text-sm">{item.name}</div>
                    <div className="text-xs text-gray-400 mt-0.5">{item.notes}</div>
                  </td>
                  <td className="px-4 py-3">
                    <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-medium border ${rc.cls}`}>
                      {rc.icon} {rc.label}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-xs text-gray-600">{item.owner}</td>
                  <td className="px-4 py-3">
                    <span className="px-2 py-0.5 rounded text-xs text-gray-500" style={{ background: C.offwhite, border: `1px solid ${C.gray}` }}>
                      {item.cat}
                    </span>
                  </td>
                  <td className="px-4 py-3 text-xs text-gray-500">{item.dep}</td>
                  <td className="px-4 py-3 text-center text-xs font-semibold text-gray-600">{item.contrib}%</td>

              );
            })}
          </tbody>

      </Card>

      {/* AI Accuracy placeholder */}
      <div style={{ background: 'white', border: '1px solid #E8E8E4', borderLeft: `4px solid ${C.blue}`, borderRadius: 8, padding: 20 }}>

          <div>
            <div style={{ fontSize: 9, fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.12em', color: C.amber, marginBottom: 2 }}>Measurement Model In Definition</div>
            <div style={{ fontSize: 13, fontWeight: 600, color: C.charcoal }}>AI Accuracy & Document Quality Tracking</div>
            <div style={{ fontSize: 11, color: '#9ca3af', marginTop: 2 }}>Placeholder metrics — measurement approach is still being defined</div>
          </div>
          <span style={{ fontSize: 10, background: '#f5f3ff', border: '1px solid #e9d5ff', borderRadius: 999, padding: '3px 10px', color: '#7c3aed', fontWeight: 600, whiteSpace: 'nowrap' }}>◷ Future State</span>

              <div style={{ fontSize: 13, fontWeight: 700, color: '#d1d5db' }}>TBD</div>
            </div>
          ))}

        <div style={{ fontSize: 10, background: '#eff6ff', border: '1px solid #bfdbfe', borderRadius: 6, padding: '8px 12px', color: '#1e40af' }}>

        </div>
      </div>

      <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 text-xs text-amber-800">
        <strong>Readiness Score Formula:</strong> (Ready items × full contribution) + (Partial items × 50% contribution) ÷ total possible contribution.
        Future State items are excluded from current readiness score.
      </div>
    </div>
  );
}

  );
}

// ─────────────────────────────────────────────────────────────────
// APP ROOT
// ─────────────────────────────────────────────────────────────────
function App() {
  const [active, setActive] = useState('overview');
  const [kpis,   setKpis]   = useState(KPI_DATA.map(k => ({ ...k })));
  const [calc,   setCalc]   = useState({ ...CALC_DEFAULT });
  const [reportingCfg, setReportingCfg] = useState({ mode: 'quarterly', monthlyStart: '2026-01', monthlyEnd: '2026-03', quarter: 'Q1' });

  const SECTIONS = {
    overview:    <ExecutiveOverview kpis={kpis} calc={calc} />,
    scoring:     <ValueScoring />,
    kpi:         <KPIFramework kpis={kpis} onKpisChange={setKpis} />,
    calculator:  <ValueCalculator calc={calc} setCalc={setCalc} />,
    pipeline:    <PipelineSummary />,
    roadmap:     <Roadmap />,
    readiness:   <MeasurementReadiness />,
    assumptions: <AssumptionsLog />,
  };

  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: C.offwhite, fontFamily: "'Inter',system-ui,sans-serif" }}>
      <Sidebar active={active} onNav={setActive} />
      <div style={{ marginLeft: 224, flex: 1, display: 'flex', flexDirection: 'column', minHeight: '100vh', minWidth: 0 }}>
        <TopBar active={active} reportingCfg={reportingCfg} setReportingCfg={setReportingCfg} />
        <main style={{ flex: 1, padding: 24, overflowY: 'auto' }}>
          {SECTIONS[active]}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
